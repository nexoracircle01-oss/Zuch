<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zuch</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#EEF2F7;--ink:#0F1D33;--mute:#5B6B82;--line:#C9D3E0;--card:#FFFFFF;--blue:#1B4B8F;--amber:#B97A10;--ok:#1F7A4D;--bad:#B3261E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1424;--ink:#E6EDF7;--mute:#92A1B8;--line:#24344F;--card:#12203A;--blue:#6FA3F0;--amber:#E3A64A;--ok:#52C38B;--bad:#FF8A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1424;--ink:#E6EDF7;--mute:#92A1B8;--line:#24344F;--card:#12203A;--blue:#6FA3F0;--amber:#E3A64A;--ok:#52C38B;--bad:#FF8A80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI","Noto Naskh Arabic",system-ui,sans-serif;
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font:700 26px/1.2 Georgia,"Times New Roman",serif;margin:8px 0 2px}
h2{font:700 18px/1.3 Georgia,serif;margin:0 0 8px}
.sub{color:var(--mute);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin:0 0 12px}
.rank{border-left:4px solid var(--amber)}
.rank b{font-size:20px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--blue)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:22px}
.stats span{color:var(--mute);font-size:13px}
nav{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto}
button{font:inherit;cursor:pointer;border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:4px;padding:10px 14px;min-height:44px}
:root[data-theme="dark"] button,:root:not([data-theme="light"]) button{color:#0B1424}
button.ghost{background:transparent;color:var(--blue)}
nav button{flex:1;white-space:nowrap}
nav button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.s{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.s:last-child{border:0}
.tag{font-size:13px;color:var(--mute);white-space:nowrap}
.tag.ok{color:var(--ok);font-weight:600}
.q{margin:0 0 14px}
.q label{display:block;margin-bottom:4px}
input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.ur{color:var(--mute);font-size:14px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const SERIES=["Advanced Mathematics","Advanced Physics","Electrical Engineering","Electronics Engineering","Mechanical Engineering","Computer Science","Embedded Systems","Robotics Engineering","Control Systems","Sensors and Actuators","Artificial Intelligence","Computer Vision and Perception","Autonomous Robotics","Communication and Networking","Agricultural Robotics","Industrial Robotics","Medical Robotics","Humanoid and Bio-Inspired Robotics","Space Robotics","Underwater Robotics","Advanced Materials and Nanotechnology","Advanced Research and Future Technology","Robotics Manufacturing and Company Development"];
const RANKS=["Robotics Beginner","Mathematics Explorer","Engineering Student","Electronics Apprentice","Mechanical Designer","Embedded Systems Developer","Robotics Programmer","Robotics Engineer","Autonomous Systems Engineer","AI Robotics Engineer","Advanced Robotics Researcher","Robotics Architect","Master Robotics Researcher","Chief Robotics Innovator"];
const MATH=[
{q:"Solve for x: 2x + 6 = 14",a:["4"],e:"2x = 8, so x = 4. / ٻنهي طرفن کان 6 گھٽايو، پوءِ 2 سان ورهايو."},
{q:"What is sin 30°?",a:["0.5","1/2",".5"],e:"sin 30° = 1/2 (30-60-90 triangle). / 30° جي sine اڌ آهي."},
{q:"d/dx of x³ = ?",a:["3x^2","3x²","3*x^2","3x2"],e:"Power rule: d/dx xⁿ = n·xⁿ⁻¹, so 3x². / Power rule لاڳو ڪريو."},
{q:"Determinant of [[2,1],[3,4]] = ?",a:["5"],e:"det = ad − bc = 2·4 − 1·3 = 5. / ad − bc."},
{q:"∫ 2x dx = ?",a:["x^2+c","x²+c","x^2","x²","x^2 + c","x² + c"],e:"∫ 2x dx = x² + C. / Constant C نه وسارڻ."}];
let S;
try{S=JSON.parse(localStorage.getItem("rea")||"null")}catch(e){S=null}
S=S||{done:{},asked:0,right:0,xp:0,days:[],wrong:[]};
function save(){try{localStorage.setItem("rea",JSON.stringify(S))}catch(e){}}
function today(){return new Date().toISOString().slice(0,10)}
if(!S.days.includes(today())){S.days.push(today());save()}
let tab="home",quiz=null;
const $=h=>{document.getElementById("app").innerHTML=h};
function rankIdx(){return Math.min(RANKS.length-1,Object.keys(S.done).length)}
function pct(){return Math.round(Object.keys(S.done).length/SERIES.length*100)}
function acc(){return S.asked?Math.round(S.right/S.asked*100):0}
function nav(){return `<nav>${[["home","Home"],["lib","Series"],["exam","Diagnostic"],["rev","Revision"]].map(t=>`<button class="${tab===t[0]?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("")}</nav>`}
function go(t){tab=t;quiz=null;render()}
function render(){
let h=`<h1><img src="logo.jpg" alt="" onerror="this.style.display='none'" style="width:36px;height:36px;border-radius:8px;vertical-align:middle;margin-right:10px">Zuch</h1><p class="sub">Multi-Purpose Robotics Engineer · روبوٽڪس انجنيئرنگ</p>`+nav();
if(tab==="home"){
const r=rankIdx();
h+=`<div class="card rank"><div class="ur">Current rank / موجوده درجو</div><b>${RANKS[r]}</b><div class="sub" style="margin:4px 0 0">Next: ${RANKS[Math.min(r+1,13)]}. Ranks are earned by passing assessments.</div></div>
<div class="card"><h2>Progress</h2><div class="bar"><i style="width:${pct()}%"></i></div><span class="sub">${Object.keys(S.done).length} of ${SERIES.length} series passed (${pct()}%)</span>
<div class="stats" style="margin-top:12px"><div><b>${acc()}%</b><span>Accuracy</span></div><div><b>${S.asked}</b><span>Questions</span></div><div><b>${S.days.length}</b><span>Study days</span></div></div></div>
<div class="card"><h2>Next step</h2><p>${S.done[0]?"Open the Series tab and continue with Series 02: Advanced Physics.":"Take the Mathematics diagnostic. It decides where your learning sequence starts."}</p><button onclick="go('exam')">${S.done[0]?"Retake diagnostic":"Start diagnostic"}</button></div>`;
}
if(tab==="lib"){
h+=`<div class="card"><h2>All 23 series</h2>`+SERIES.map((n,i)=>`<div class="s"><span>${String(i+1).padStart(2,"0")}  ${n}</span><span class="tag ${S.done[i]?"ok":""}">${S.done[i]?"Passed":i===0?"Diagnostic open":"Locked by prerequisites"}</span></div>`).join("")+`</div><p class="ur">A series counts as complete only after its assessment is passed (80%+). / سيريز تڏهن مڪمل ٿيندي جڏهن امتحان پاس ٿئي.</p>`;
}
if(tab==="exam"){
if(!quiz){h+=`<div class="card"><h2>Mathematics diagnostic</h2><p>5 questions. Answers appear only after you submit. Write "don't know" if unsure.</p><button onclick="startQ()">Begin</button></div>`}
else if(quiz.res){
const sc=quiz.res.filter(x=>x.ok).length;
h+=`<div class="card"><h2>Score: ${sc} / ${MATH.length}</h2><p>${sc>=4?"Foundation verified. Series 01 marked as passed for now; deeper topics will still be tested.":"Review the corrections below. Foundations come first."}</p></div>`+quiz.res.map((x,i)=>`<div class="card"><b class="${x.ok?"ok":"bad"}">${x.ok?"Correct":"Incorrect"}</b> — ${MATH[i].q}<br>Your answer: ${x.v||"(blank)"}<br><span class="ur">${MATH[i].e}</span></div>`).join("")+`<button onclick="startQ()">Try again</button>`;
}else{
h+=`<div class="card"><h2>Mathematics diagnostic</h2>`+MATH.map((m,i)=>`<div class="q"><label for="q${i}">${i+1}. ${m.q}</label><input type="text" id="q${i}" autocomplete="off"></div>`).join("")+`<button onclick="submitQ()">Submit answers</button></div>`;
}}
if(tab==="rev"){
h+=`<div class="card"><h2>Revision list</h2>`+(S.wrong.length?S.wrong.map(i=>`<div class="s"><span>${MATH[i].q}</span><span class="tag">${MATH[i].a[0]}</span></div>`).join("")+`<p class="ur">Tracked from your mistakes. Retake the diagnostic to clear them.</p>`:`<p>No mistakes tracked yet.</p>`)+`</div>`;
}
h+=`<button class="ghost" onclick="resetAll()">Reset progress</button>`;
$(h);
}
function startQ(){quiz={};render()}
function norm(s){return s.toLowerCase().replace(/\s+/g,"")}
function submitQ(){
const res=MATH.map((m,i)=>{const v=document.getElementById("q"+i).value.trim();return{v,ok:m.a.some(a=>norm(a)===norm(v))}});
const sc=res.filter(x=>x.ok).length;
S.asked+=MATH.length;S.right+=sc;S.xp+=sc*10;
S.wrong=res.map((x,i)=>x.ok?null:i).filter(x=>x!==null);
if(sc>=4)S.done[0]=today();else delete S.done[0];
save();quiz={res};render();window.scrollTo(0,0);
}
function resetAll(){if(confirm("Delete all saved progress?")){S={done:{},asked:0,right:0,xp:0,days:[today()],wrong:[]};save();go("home")}}
render();
</script>
</body>
</html>
