<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Kinematics: car with u, v, a, s">
<title>Kinematics: car with u, v, a, s</title>
<defs>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#D5DDE8" stroke-width="1"/></pattern>
<marker id="arrI" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F1D33"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F2A900"/></marker>
</defs>
<style>.o{fill:none;stroke:#0F1D33;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.f{fill:#FFE9A8;stroke:#0F1D33;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.w{fill:#fff;stroke:#0F1D33;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.a{fill:none;stroke:#F2A900;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.d{stroke-dasharray:9 7}
.th{stroke-width:2.5}
.h{stroke:#1D4E8F;stroke-width:2;stroke-linecap:round}
.en{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:20px;fill:#0F1D33;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.sd{font-family:'Noto Naskh Arabic','Noto Sans Arabic','Segoe UI',Arial,sans-serif;font-weight:700;font-size:20px;fill:#1D4E8F;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.mono{font-family:'Courier New',Consolas,monospace}
.nh{stroke:none}</style>
<rect width="800" height="500" fill="#fff"/>
<rect width="800" height="500" fill="url(#grid)"/>
<text x="400" y="42" class="en" style="font-size:32px">Kinematics</text>
<text x="400" y="74" class="sd" style="font-size:26px">حرڪت</text>
<line class="o" x1="30" y1="332" x2="770" y2="332"/>
<g transform="translate(70,330)"><rect class="o d" x="0" y="-46" width="130" height="30" rx="8"/><path class="o d" d="M24 -46 L42 -76 H92 L110 -46 Z"/><circle class="o d" cx="30" cy="-16" r="16"/><circle class="o d" cx="100" cy="-16" r="16"/></g>
<g transform="translate(500,330)"><rect class="f" x="0" y="-46" width="130" height="30" rx="8"/><path class="f" d="M24 -46 L42 -76 H92 L110 -46 Z"/><line class="o th" x1="67" y1="-74" x2="67" y2="-47"/><circle class="w" cx="30" cy="-16" r="16"/><circle class="w" cx="100" cy="-16" r="16"/></g>
<line class="a" x1="85" y1="240" x2="170" y2="240" marker-end="url(#arrA)"/>
<text x="127" y="208" class="en" style="font-size:36px">u</text>
<line class="a" x1="500" y1="240" x2="650" y2="240" marker-end="url(#arrA)"/>
<text x="575" y="208" class="en" style="font-size:36px">v</text>
<line class="o" x1="240" y1="170" x2="420" y2="170" marker-end="url(#arrI)" style="stroke-width:6"/>
<text x="330" y="142" class="en" style="font-size:36px">a</text>
<line class="o d" x1="135" y1="336" x2="135" y2="372" style="stroke-width:2.5"/>
<line class="o d" x1="565" y1="336" x2="565" y2="372" style="stroke-width:2.5"/>
<line class="o" x1="135" y1="382" x2="565" y2="382" marker-end="url(#arrI)" marker-start="url(#arrI)"/>
<text x="350" y="372" class="en" style="font-size:34px">s</text>
<text x="110" y="438" class="en" style="font-size:17px">u = Initial velocity</text>
<text x="110" y="464" class="sd" style="font-size:19px">ابتدائي رفتار</text>
<text x="300" y="438" class="en" style="font-size:17px">v = Final velocity</text>
<text x="300" y="464" class="sd" style="font-size:19px">آخري رفتار</text>
<text x="500" y="438" class="en" style="font-size:17px">a = Acceleration</text>
<text x="500" y="464" class="sd" style="font-size:19px">تيزي</text>
<text x="690" y="438" class="en" style="font-size:17px">s = Distance</text>
<text x="690" y="464" class="sd" style="font-size:19px">مفاصلو</text>
</svg>
