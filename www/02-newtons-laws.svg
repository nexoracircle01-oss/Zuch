<text x="380" y="192" class="en" style="font-size:32px">a</text>
<text x="400" y="452" class="en" style="font-size:30px">F = m × a</text>
<text x="400" y="484" class="sd" style="font-size:22px">قوت = ڪتلو × تيزي</text>
