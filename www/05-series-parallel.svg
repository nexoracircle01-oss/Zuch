<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Resistors in series and in parallel">
<title>Resistors in series and in parallel</title>
<defs>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#D5DDE8" stroke-width="1"/></pattern>
<marker id="arrI" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F1D33"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F2A900"/></marker>
</defs>
<style>.o{fill:none;stroke:#0F1D33;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.f{fill:#FFE9A8;stroke:#0F1D33;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.w{fill:#fff;stroke:#0F1D33;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.a{fill:none;stroke:#F2A900;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.d{stroke-dasharray:9 7}
.th{stroke-width:2.5}
.h{stroke:#1D4E8F;stroke-width:2;stroke-linecap:round}
.en{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:20px;fill:#0F1D33;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.sd{font-family:'Noto Naskh Arabic','Noto Sans Arabic','Segoe UI',Arial,sans-serif;font-weight:700;font-size:20px;fill:#1D4E8F;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.mono{font-family:'Courier New',Consolas,monospace}
.nh{stroke:none}</style>
<rect width="800" height="500" fill="#fff"/>
<rect width="800" height="500" fill="url(#grid)"/>
<text x="400" y="42" class="en" style="font-size:32px">Series &amp; Parallel</text>
<text x="400" y="74" class="sd" style="font-size:26px">سلسلي وار ۽ متوازي</text>
<line class="o d" x1="400" y1="100" x2="400" y2="485" style="stroke-width:2;stroke:#97A6BC"/>
<text x="210" y="112" class="en" style="font-size:24px">Series</text>
<text x="210" y="140" class="sd" style="font-size:22px">سلسلي وار</text>
<text x="600" y="112" class="en" style="font-size:24px">Parallel</text>
<text x="600" y="140" class="sd" style="font-size:22px">متوازي</text>
<path class="o" d="M70 330 V190 H130 M190 190 H230 M290 190 H350 V330 H216 M200 330 H70"/>
<rect class="w" x="130" y="175" width="60" height="30" rx="4"/>
<text x="160" y="196" class="en nh" style="font-size:17px">R₁</text>
<rect class="w" x="230" y="175" width="60" height="30" rx="4"/>
<text x="260" y="196" class="en nh" style="font-size:17px">R₂</text>
<line class="o" x1="200" y1="310" x2="200" y2="350" style="stroke-width:6"/>
<line class="o" x1="216" y1="319" x2="216" y2="341" style="stroke-width:11"/>
<text x="210" y="400" class="en" style="font-size:24px">R = R₁ + R₂</text>
<text x="210" y="440" class="en" style="font-size:16px">One path: same current</text>
<text x="210" y="464" class="sd" style="font-size:17px">هڪ رستو: ساڳيو ڪرنٽ</text>
<path class="o" d="M520 190 V330 H600 M616 330 H700 V190 M520 190 H570 M630 190 H700 M520 262 H570 M630 262 H700"/>
<path class="o" d="M700 190 V262"/>
<rect class="w" x="570" y="175" width="60" height="30" rx="4"/>
<text x="600" y="196" class="en nh" style="font-size:17px">R₁</text>
<rect class="w" x="570" y="247" width="60" height="30" rx="4"/>
<text x="600" y="268" class="en nh" style="font-size:17px">R₂</text>
<line class="o" x1="600" y1="310" x2="600" y2="350" style="stroke-width:6"/>
<line class="o" x1="616" y1="319" x2="616" y2="341" style="stroke-width:11"/>
<circle cx="520" cy="190" r="5.5" fill="#0F1D33"/>
<circle cx="520" cy="262" r="5.5" fill="#0F1D33"/>
<circle cx="700" cy="190" r="5.5" fill="#0F1D33"/>
<circle cx="700" cy="262" r="5.5" fill="#0F1D33"/>
<text x="610" y="400" class="en" style="font-size:24px">1/R = 1/R₁ + 1/R₂</text>
<text x="610" y="440" class="en" style="font-size:16px">Many paths: same voltage</text>
<text x="610" y="464" class="sd" style="font-size:17px">ڪيترائي رستا: ساڳيو وولٽيج</text>
</svg>
