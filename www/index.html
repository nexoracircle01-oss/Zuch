<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zuch</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#EEF2F7;--ink:#0F1D33;--mute:#5B6B82;--card:#fff;--line:#D5DDE8;--blue:#1D4E8F;--ok:#1B8A4B;--bad:#C0392B;--amber:#E0A100}
@media (prefers-color-scheme:dark){:root{--bg:#0D1524;--ink:#E8EEF7;--mute:#97A6BC;--card:#16213A;--line:#2A3957;--blue:#3B78C8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;padding-top:env(safe-area-inset-top)}
main{max-width:720px;margin:0 auto;padding:16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:12px;background:#000;color:#fff;display:grid;place-items:center;font:700 26px Georgia,serif}
h1{font:700 30px/1.2 Georgia,"Times New Roman",serif;margin:0}
h2{font:700 18px/1.3 Georgia,serif;margin:0 0 10px}
.sub{color:var(--mute);margin:6px 0 14px;font-size:14px}
.tabs,.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.tabs button{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:15px;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--bg)}
.chips button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:15px;white-space:nowrap}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}
.q{font-size:20px;font-weight:600;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:14px;margin:8px 0;font-size:17px}
.opt.ok{border-color:var(--ok);background:rgba(27,138,75,.15)}
.opt.bad{border-color:var(--bad);background:rgba(192,57,43,.15)}
.exp{margin-top:10px;padding:10px;border-left:4px solid var(--amber);font-size:15px}
.go{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:14px 20px;font-size:16px;width:100%;margin-top:10px}
.ghost{background:transparent;color:var(--blue);border:1px solid var(--blue);border-radius:6px;padding:14px 20px;font-size:16px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;gap:8px}
.row:last-child{border:0}
.st{letter-spacing:2px;white-space:nowrap}
.small{font-size:13px;color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--blue)}
</style>
</head>
<body>
<main>
<div class="brand"><div class="logo">Z</div><h1>Zuch</h1></div>
<div class="sub">Multi-Purpose Robotics Engineer · روبوٽڪس انجنيئرنگ</div>
<div id="app"></div>
</main>
<script>
const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[r(0,a.length-1)];
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const sg=n=>n<0?' − '+(-n):' + '+n;
const nz=(a,b)=>{let v=0;while(!v)v=r(a,b);return v};
const fr=(n,d)=>{const g=gcd(n,d)||1;n/=g;d/=g;if(d<0){n=-n;d=-d}return d===1?String(n):n+'/'+d};
const term=(c,p)=>p===0?String(c):p===1?c+'x':c+'x^'+p;
const rd=x=>+x.toFixed(2);

const G={
"Linear Equations":[
 ()=>{const x=r(2,20),a=r(2,20);return{q:`x + ${a} = ${x+a}. Find x.`,ans:x,e:`x = ${x+a} − ${a} = ${x}`}},
 ()=>{const x=r(-10,12),a=r(2,9),b=r(-15,15),c=a*x+b;return{q:`${a}x${sg(b)} = ${c}. Find x.`,ans:x,e:`${a}x = ${c} − (${b}) = ${c-b}, so x = ${x}`}},
 ()=>{const x=r(-9,12),a=r(5,12),c=r(1,a-1),b=r(-10,15),d=(a-c)*x+b;return{q:`${a}x${sg(b)} = ${c}x${sg(d)}. Find x.`,ans:x,e:`${a-c}x = ${d-b}, so x = ${x}`}}
],
"Percentages":[
 ()=>{const p=pick([5,10,15,20,25,50]),n=pick([40,60,80,100,120,200,240]);return{q:`What is ${p}% of ${n}?`,ans:n*p/100,e:`${n} × ${p}/100 = ${n*p/100}`}},
 ()=>{const p=pick([10,20,25,50]),n=pick([40,60,80,120,200]),up=Math.random()<.5;const v=n*(100+(up?p:-p))/100;return{q:`${n} is ${up?'increased':'decreased'} by ${p}%. New value?`,ans:v,e:`${n} × ${100+(up?p:-p)}/100 = ${v}`}},
 ()=>{const o=pick([40,60,80,100,120,200]),p=pick([20,25,50]),v=o*(100+p)/100;return{q:`After a ${p}% increase a value becomes ${v}. What was the original value?`,ans:o,d:[rd(v*(100-p)/100),v-p],e:`Original × ${100+p}/100 = ${v}, so original = ${v} × 100/${100+p} = ${o}`}}
],
"Fractions":[
 ()=>{const d=r(4,12),a=r(1,d-1),b=r(1,d-1);return{q:`${a}/${d} + ${b}/${d} = ?`,ans:fr(a+b,d),d:[`${a+b}/${2*d}`,fr(a*b,d),fr(a+b+1,d),fr(a+b,d+1)],e:`Same denominator: (${a}+${b})/${d} = ${fr(a+b,d)}`}},
 ()=>{const a=r(1,8),b=r(2,9),c=r(1,8),d=r(2,9);return{q:`${a}/${b} + ${c}/${d} = ?`,ans:fr(a*d+c*b,b*d),d:[`${a+c}/${b+d}`,fr(a*d+c*b+1,b*d),fr(a*c,b*d),fr(Math.abs(a*d-c*b)+2,b*d)],e:`(${a}×${d} + ${c}×${b}) / (${b}×${d}) = ${fr(a*d+c*b,b*d)}`}},
 ()=>{const a=r(1,9),b=r(2,9),c=r(1,9),d=r(2,9);return{q:`${a}/${b} ÷ ${c}/${d} = ?`,ans:fr(a*d,b*c),d:[fr(a*c,b*d),fr(b*c,a*d),fr(a*d+1,b*c),fr(a*d,b*c+1),fr(a*d+2,b*c)],e:`Flip and multiply: ${a}/${b} × ${d}/${c} = ${fr(a*d,b*c)}`}}
],
"Quadratics":[
 ()=>{const p=r(2,15);return{q:`x² = ${p*p} and x > 0. Find x.`,ans:p,e:`√${p*p} = ${p}`}},
 ()=>{const p=r(1,9);let q=r(1,9);while(q===p)q=r(1,9);return{q:`Find the larger root of x²${sg(-(p+q))}x${sg(p*q)} = 0.`,ans:Math.max(p,q),e:`Factor: (x − ${p})(x − ${q}) = 0, roots ${p} and ${q}`}},
 ()=>{if(Math.random()<.5){const a=r(1,5),b=nz(-9,9),c=nz(-6,6);return{q:`Discriminant of ${a}x²${sg(b)}x${sg(c)}?`,ans:b*b-4*a*c,e:`b² − 4ac = ${b*b} − ${4*a*c} = ${b*b-4*a*c}`}}
  const a=r(1,4),m=r(-6,9),n=r(-6,9),sum=Math.random()<.5;const b=-a*(m+n),c=a*m*n;return{q:`For ${a}x²${sg(b)}x${sg(c)} = 0, what is the ${sum?'sum':'product'} of the roots?`,ans:sum?m+n:m*n,e:sum?`−b/a = ${m+n}`:`c/a = ${m*n}`}}
],
"Trigonometry":[
 ()=>{const T=[['sin 30°','1/2'],['sin 45°','√2/2'],['sin 60°','√3/2'],['cos 30°','√3/2'],['cos 45°','√2/2'],['cos 60°','1/2'],['tan 45°','1'],['tan 30°','1/√3'],['tan 60°','√3'],['sin 90°','1'],['cos 0°','1'],['sin 0°','0']];const t=pick(T);const pool=['0','1/2','√2/2','√3/2','1','1/√3','√3'];return{q:`Value of ${t[0]}?`,ans:t[1],d:sh(pool.filter(x=>x!==t[1])).slice(0,3),e:`Standard value: ${t[0]} = ${t[1]}`}},
 ()=>{const [a,b,h]=pick([[3,4,5],[5,12,13],[8,15,17],[7,24,25]]);const k=r(1,4);if(Math.random()<.5)return{q:`Right triangle, legs ${a*k} and ${b*k}. Find the hypotenuse.`,ans:h*k,e:`√(${a*k}² + ${b*k}²) = ${h*k}`};return{q:`Right triangle, hypotenuse ${h*k}, one leg ${a*k}. Find the other leg.`,ans:b*k,e:`√(${h*k}² − ${a*k}²) = ${b*k}`}},
 ()=>{const [o,a,h]=pick([[3,4,5],[5,12,13],[8,15,17],[7,24,25]]);const ask=pick(['cos','tan']);const ans=ask==='cos'?fr(a,h):fr(o,a);return{q:`θ is acute and sin θ = ${o}/${h}. Find ${ask} θ.`,ans,d:[fr(o,h),fr(a,h),fr(o,a),fr(a,o),fr(h,a)].filter(x=>x!==ans),e:`Adjacent = ${a}. cos = adj/hyp, tan = opp/adj. ${ask} θ = ${ans}`}}
],
"Derivatives":[
 ()=>{const a=r(2,9),n=r(2,6);return{q:`d/dx of ${term(a,n)} = ?`,ans:term(a*n,n-1),d:[term(a*n,n),term(a,n-1),term(a*(n-1),n-1),term(a*n+1,n-1),term(a*n,n+1)],e:`Power rule: ${a}·${n} x^${n-1} = ${term(a*n,n-1)}`}},
 ()=>{const a=r(1,6),b=nz(-9,9),c=nz(-9,9),k=r(-4,5);return{q:`If f(x) = ${a}x²${sg(b)}x${sg(c)}, find f′(${k}).`,ans:2*a*k+b,e:`f′(x) = ${2*a}x${sg(b)}, so f′(${k}) = ${2*a*k+b}`}},
 ()=>{const a=r(1,4),b=nz(-6,6),c=nz(-9,9),k=r(-3,4);return{q:`Slope of y = ${a}x³${sg(b)}x²${sg(c)}x at x = ${k}?`,ans:3*a*k*k+2*b*k+c,e:`y′ = ${3*a}x²${sg(2*b)}x${sg(c)}, at x=${k}: ${3*a*k*k+2*b*k+c}`}}
],
"Integrals":[
 ()=>{const a=pick([2,4,6,8]),k=r(2,8);return{q:`Evaluate the integral of ${a}x dx from 0 to ${k}.`,ans:a*k*k/2,e:`${a}x²/2 at ${k} = ${a*k*k/2}`}},
 ()=>{const a=pick([3,6,9]),k=r(1,5);return{q:`Evaluate the integral of ${a}x² dx from 0 to ${k}.`,ans:a*k**3/3,e:`${a/3}x³ at ${k} = ${a*k**3/3}`}},
 ()=>{const a=pick([3,6,9]),b=pick([2,4,6,8]),k=r(1,4);return{q:`Evaluate the integral of (${a}x² + ${b}x) dx from 0 to ${k}.`,ans:a*k**3/3+b*k*k/2,e:`${a/3}x³ + ${b/2}x² at ${k} = ${a*k**3/3+b*k*k/2}`}}
],
"Series":[
 ()=>{const a=r(1,20),d=r(2,9),n=r(8,20);return{q:`AP: ${a}, ${a+d}, ${a+2*d}, … Find term ${n}.`,ans:a+(n-1)*d,e:`a + (n−1)d = ${a} + ${n-1}×${d} = ${a+(n-1)*d}`}},
 ()=>{const a=r(1,15),d=r(2,8),n=pick([6,8,10,12,14,16,20]);return{q:`AP: first term ${a}, common difference ${d}. Sum of first ${n} terms?`,ans:n*(2*a+(n-1)*d)/2,e:`n/2 · (2a + (n−1)d) = ${n*(2*a+(n-1)*d)/2}`}},
 ()=>{const a=r(1,5),q=pick([2,3]),n=r(4,7);if(Math.random()<.5)return{q:`GP: first term ${a}, ratio ${q}. Find term ${n}.`,ans:a*q**(n-1),e:`a·r^(n−1) = ${a}×${q}^${n-1} = ${a*q**(n-1)}`};return{q:`GP: first term ${a}, ratio ${q}. Sum of first ${n} terms?`,ans:a*(q**n-1)/(q-1),e:`a(rⁿ−1)/(r−1) = ${a*(q**n-1)/(q-1)}`}}
]
};
const T=Object.keys(G),L=['Basic','Medium','Advanced'];

function build(t,l){
 const g=G[t][l]();const ans=String(g.ans);const set=[ans];
 (g.d||[]).forEach(x=>{x=String(x);if(!set.includes(x))set.push(x)});
 let n=0;
 while(set.length<4&&!isNaN(+ans)&&n++<60){const v=String(rd(+ans+pick([-1,1,-2,2,-3,3,5,-5,10])));if(!set.includes(v))set.push(v)}
 return{q:g.q,ans,e:g.e,t,l,opts:sh(set.slice(0,4))};
}

const KEY='zuch_v2';
const fresh=()=>({xp:0,streak:0,best:0,stats:{},rev:[]});
function load(){try{return Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return fresh()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
let tab='home',topic=0,lvl=0,cur=null,picked=null,dg=null,rvI=0,rvPicked=null;

function record(q,ok){
 const k=q.t+'|'+q.l;const s=S.stats[k]||(S.stats[k]={a:0,c:0});s.a++;
 const same=x=>x.q===q.q&&x.t===q.t;
 if(ok){s.c++;S.xp+=10;S.streak++;S.best=Math.max(S.best,S.streak);S.rev=S.rev.filter(x=>!same(x))}
 else{S.streak=0;if(!S.rev.some(same)){S.rev.unshift(q);S.rev=S.rev.slice(0,60)}}
 save();
}
const starOf=(t,l)=>{const s=S.stats[t+'|'+L[l]];return s&&s.a>=8&&s.c/s.a>=.8};

function qCard(q,p,fn){
 let h=`<div class="card"><div class="small">${q.t} · ${q.l}</div><div class="q">${q.q}</div>`;
 q.opts.forEach((o,i)=>{let c='opt';if(p!==null){if(o===q.ans)c+=' ok';else if(i===p)c+=' bad'}
  h+=`<button class="${c}" ${p!==null?'disabled':''} onclick="${fn}(${i})">${'ABCD'[i]}. ${o}</button>`});
 if(p!==null)h+=`<div class="exp">${q.opts[p]===q.ans?'✅ Correct!':'❌ Correct answer: '+q.ans}<br>${q.e}</div>`;
 return h+'</div>';
}

function vHome(){
 let a=0,c=0;Object.values(S.stats).forEach(s=>{a+=s.a;c+=s.c});
 const acc=a?Math.round(c*100/a):0;
 let stars=0;T.forEach(t=>L.forEach((_,l)=>{if(starOf(t,l))stars++}));
 let h=`<div class="stats"><div class="stat"><b>${a}</b>Questions solved</div><div class="stat"><b>${acc}%</b>Accuracy</div><div class="stat"><b>${S.xp}</b>XP</div><div class="stat"><b>${S.streak} 🔥</b>Streak (best ${S.best})</div></div>`;
 h+=`<div class="card"><h2>Stars ${stars} / ${T.length*3}</h2>`;
 T.forEach((t,i)=>{h+=`<div class="row"><span>${t}</span><span class="st">${[0,1,2].map(l=>starOf(t,l)?'★':'☆').join('')}</span></div>`});
 h+=`<div class="small" style="margin-top:8px">Mastery: 8+ answers with 80% accuracy in a level gives a star. / هر level ۾ 8 جواب ۽ %80 صحيح ٿين تي ستارو ملندو.</div></div>`;
 return h+`<div class="card small">Unlimited questions: every question is generated fresh, so they never repeat the same way.</div>`;
}

function vPractice(){
 if(!cur)cur=build(T[topic],lvl);
 let h=`<div class="chips">${T.map((t,i)=>`<button class="${i===topic?'on':''}" onclick="setT(${i})">${t}</button>`).join('')}</div>`;
 h+=`<div class="chips">${L.map((t,i)=>`<button class="${i===lvl?'on':''}" onclick="setL(${i})">${t}</button>`).join('')}</div>`;
 h+=qCard(cur,picked,'pickP');
 if(picked!==null)h+=`<button class="go" onclick="nextP()">Next question →</button>`;
 const s=S.stats[T[topic]+'|'+L[lvl]];
 if(s)h+=`<div class="small">This level: ${s.c}/${s.a} correct${starOf(topic,lvl)?' · ★ earned':''}</div>`;
 return h;
}
function setT(i){topic=i;cur=null;picked=null;render()}
function setL(i){lvl=i;cur=null;picked=null;render()}
function pickP(i){if(picked!==null)return;picked=i;record(cur,cur.opts[i]===cur.ans);render()}
function nextP(){cur=build(T[topic],lvl);picked=null;render();window.scrollTo(0,0)}

function vDiag(){
 if(!dg)return `<div class="card"><h2>Diagnostic test</h2><p>10 mixed Medium questions across all topics. At the end you see which topics need work.</p><button class="go" onclick="startD()">Start diagnostic</button></div>`;
 if(dg.i>=dg.qs.length){
  const sc=dg.res.filter(x=>x.ok).length;const by={};
  dg.res.forEach(x=>{const b=by[x.t]||(by[x.t]={a:0,c:0});b.a++;if(x.ok)b.c++});
  let h=`<div class="card"><h2>Score: ${sc} / ${dg.qs.length}</h2><div class="bar"><i style="width:${sc*100/dg.qs.length}%"></i></div>`;
  Object.keys(by).forEach(t=>{h+=`<div class="row"><span>${t}</span><span>${by[t].c}/${by[t].a} ${by[t].c<by[t].a?'· practice more':'✓'}</span></div>`});
  return h+`<button class="go" onclick="startD()">Retake</button></div>`;
 }
 let h=`<div class="small">Question ${dg.i+1} of ${dg.qs.length}</div>`+qCard(dg.qs[dg.i],dg.p,'pickD');
 if(dg.p!==null)h+=`<button class="go" onclick="nextD()">${dg.i+1===dg.qs.length?'Finish':'Next →'}</button>`;
 return h;
}
function startD(){dg={qs:Array.from({length:10},()=>build(pick(T),1)),i:0,p:null,res:[]};render()}
function pickD(i){if(dg.p!==null)return;const q=dg.qs[dg.i];dg.p=i;const ok=q.opts[i]===q.ans;dg.res.push({t:q.t,ok});record(q,ok);render()}
function nextD(){dg.i++;dg.p=null;render();window.scrollTo(0,0)}

function vRev(){
 if(!S.rev.length)return `<div class="card"><h2>Revision list</h2><p>No mistakes saved. Wrong answers from Practice appear here.</p></div>`;
 if(rvI>=S.rev.length)rvI=0;
 const q=S.rev[rvI];
 let h=`<div class="small">${S.rev.length} question(s) to revise. Answer correctly to remove one.</div>`+qCard(q,rvPicked,'pickR');
 if(rvPicked!==null)h+=`<button class="go" onclick="nextR()">Next →</button>`;
 return h;
}
function pickR(i){if(rvPicked!==null)return;const q=S.rev[rvI];rvPicked=i;record(q,q.opts[i]===q.ans);render()}
function nextR(){rvPicked=null;rvI++;render();window.scrollTo(0,0)}

const PICS=[
['01-kinematics.svg','Kinematics'],['02-newtons-laws.svg','Newton'],
['03-work-energy.svg','Work'],['04-ohms-law.svg','Ohm'],
['05-series-parallel.svg','Series/Parallel'],['06-binary-numbers.svg','Binary'],
['07-logic-gates.svg','Logic Gates'],['08-gears.svg','Gears'],
['09-robot-arm.svg','Robot Arm'],['10-pid-controller.svg','PID'],
['11-python-for-loop.svg','Python Loop'],['12-quadratic-graph.svg','Quadratic']];
let picI=0;
function setPic(i){picI=i;render()}
function vPics(){
 let h=`<div class="chips">${PICS.map((p,i)=>`<button class="${i===picI?'on':''}" onclick="setPic(${i})">${p[1]}</button>`).join('')}</div>`;
 return h+`<div class="card"><img src="${PICS[picI][0]}" alt="${PICS[picI][1]}" style="width:100%;height:auto"></div>`;
}
function go(t){tab=t;render()}
function resetAll(){if(confirm('Delete all saved progress?')){S=fresh();save();cur=null;picked=null;dg=null;rvI=0;rvPicked=null;render()}}
function render(){
 const tabs=[['home','Home'],['practice','Practice'],['diag','Diagnostic'],['rev','Revision'],['pics','Diagrams']];
 let h=`<div class="tabs">${tabs.map(x=>`<button class="${tab===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div>`;
 h+=tab==='home'?vHome():tab==='practice'?vPractice():tab==='diag'?vDiag():tab==='pics'?vPics():vRev();
 h+=`<button class="ghost" onclick="resetAll()">Reset progress</button>`;
 document.getElementById('app').innerHTML=h;
}
render();
</script>
</body>
</html>
