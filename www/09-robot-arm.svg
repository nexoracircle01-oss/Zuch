<line class="o d" x1="389.7477455336045" y1="168.6514948777486" x2="389.7477455336045" y2="400" style="stroke-width:2.5"/>
<line class="o d" x1="389.7477455336045" y1="168.6514948777486" x2="130" y2="168.6514948777486" style="stroke-width:2.5"/>
<line class="o d" x1="230.00000000000003" y1="226.79491924311228" x2="261.00000000000006" y2="173.1013442084771" style="stroke-width:2.5"/>
<line x1="130" y1="400" x2="230.0" y2="226.8" stroke="#0F1D33" stroke-width="22" stroke-linecap="round"/>
<line x1="130" y1="400" x2="230.0" y2="226.8" stroke="#FFE9A8" stroke-width="12" stroke-linecap="round"/>
<line x1="230.0" y1="226.8" x2="389.7" y2="168.7" stroke="#0F1D33" stroke-width="22" stroke-linecap="round"/>
