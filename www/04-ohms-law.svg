<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Ohm's Law circuit with battery, resistor and bulb: V = I x R">
<title>Ohm's Law circuit with battery, resistor and bulb: V = I x R</title>
<defs>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#D5DDE8" stroke-width="1"/></pattern>
<marker id="arrI" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F1D33"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F2A900"/></marker>
</defs>
<style>.o{fill:none;stroke:#0F1D33;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.f{fill:#FFE9A8;stroke:#0F1D33;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.w{fill:#fff;stroke:#0F1D33;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.a{fill:none;stroke:#F2A900;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.d{stroke-dasharray:9 7}
.th{stroke-width:2.5}
.h{stroke:#1D4E8F;stroke-width:2;stroke-linecap:round}
.en{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:20px;fill:#0F1D33;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.sd{font-family:'Noto Naskh Arabic','Noto Sans Arabic','Segoe UI',Arial,sans-serif;font-weight:700;font-size:20px;fill:#1D4E8F;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.mono{font-family:'Courier New',Consolas,monospace}
.nh{stroke:none}</style>
<rect width="800" height="500" fill="#fff"/>
<rect width="800" height="500" fill="url(#grid)"/>
<text x="400" y="42" class="en" style="font-size:32px">Ohm's Law</text>
<text x="400" y="74" class="sd" style="font-size:26px">اوهم جو قانون</text>
<path class="o" d="M150 255 V170 H330"/>
<path class="o" d="M330 170 L345 148 L365 192 L385 148 L405 192 L425 148 L445 192 L458 170 H470"/>
<path class="o" d="M470 170 H650 V242"/>
<path class="o" d="M650 298 V370 H150 V285"/>
<line class="o" x1="125" y1="255" x2="175" y2="255" style="stroke-width:6"/>
<line class="o" x1="137" y1="285" x2="163" y2="285" style="stroke-width:11"/>
<circle class="f" cx="650" cy="270" r="28"/>
<line class="o" x1="630" y1="250" x2="670" y2="290" style="stroke-width:3"/>
<line class="o" x1="630" y1="290" x2="670" y2="250" style="stroke-width:3"/>
<text x="196" y="262" class="en" style="font-size:24px">+</text>
<text x="196" y="298" class="en" style="font-size:24px">−</text>
<line class="a" x1="190" y1="132" x2="300" y2="132" marker-end="url(#arrA)"/>
<text x="245" y="112" class="en" style="font-size:32px">I</text>
<text x="245" y="205" class="en" style="font-size:16px">Current</text>
<text x="245" y="227" class="sd" style="font-size:16px">ڪرنٽ</text>
<text x="400" y="128" class="en" style="font-size:32px">R</text>
<text x="400" y="218" class="en" style="font-size:16px">Resistance</text>
<text x="400" y="240" class="sd" style="font-size:16px">مزاحمت</text>
<text x="75" y="262" class="en" style="font-size:32px">V</text>
<text x="75" y="290" class="en" style="font-size:16px">Voltage</text>
<text x="75" y="312" class="sd" style="font-size:16px">وولٽيج</text>
<text x="75" y="346" class="en" style="font-size:16px">Battery</text>
<text x="75" y="368" class="sd" style="font-size:16px">بيٽري</text>
<text x="735" y="268" class="en" style="font-size:16px">Bulb</text>
<text x="735" y="292" class="sd" style="font-size:16px">بلب</text>
<rect class="f" x="270" y="405" width="260" height="56" rx="14"/>
<text x="400" y="445" class="en nh" style="font-size:34px">V = I × R</text>
</svg>
