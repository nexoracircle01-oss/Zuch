<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Logic gates AND, OR, XOR, NAND, NOR with inputs A=1, B=0">
<title>Logic gates AND, OR, XOR, NAND, NOR with inputs A=1, B=0</title>
<defs>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#D5DDE8" stroke-width="1"/></pattern>
<marker id="arrI" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F1D33"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F2A900"/></marker>
</defs>
<style>.o{fill:none;stroke:#0F1D33;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.f{fill:#FFE9A8;stroke:#0F1D33;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.w{fill:#fff;stroke:#0F1D33;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.a{fill:none;stroke:#F2A900;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.d{stroke-dasharray:9 7}
.th{stroke-width:2.5}
.h{stroke:#1D4E8F;stroke-width:2;stroke-linecap:round}
.en{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:20px;fill:#0F1D33;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.sd{font-family:'Noto Naskh Arabic','Noto Sans Arabic','Segoe UI',Arial,sans-serif;font-weight:700;font-size:20px;fill:#1D4E8F;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.mono{font-family:'Courier New',Consolas,monospace}
.nh{stroke:none}</style>
<rect width="800" height="500" fill="#fff"/>
<rect width="800" height="500" fill="url(#grid)"/>
<text x="400" y="42" class="en" style="font-size:32px">Logic Gates</text>
<text x="400" y="74" class="sd" style="font-size:26px">لاجڪ گيٽس</text>
<defs><path id="gAND" d="M0 -28 H50 A28 28 0 0 1 50 28 H0 Z"/><path id="gOR" d="M0 -28 Q45 -28 80 0 Q45 28 0 28 Q22 0 0 -28 Z"/><path id="gXB" d="M-10 -28 Q12 0 -10 28"/></defs>
<text x="400" y="100" class="en" style="font-size:16px">Inputs: A = 1, B = 0</text>
<text x="12" y="148" class="en" style="font-size:22px;text-anchor:start">AND</text>
<line class="o" x1="137" y1="124" x2="200" y2="124" style="stroke-width:3"/>
<circle class="f" cx="125" cy="124" r="12" style="stroke-width:3"/>
<text x="125" y="129" class="en nh" style="font-size:14px">1</text>
<line class="o" x1="137" y1="156" x2="200" y2="156" style="stroke-width:3"/>
<circle class="w" cx="125" cy="156" r="12" style="stroke-width:3"/>
<text x="125" y="161" class="en nh" style="font-size:14px">0</text>
<use href="#gAND" class="f" transform="translate(200,140)"/>
<line class="o" x1="278" y1="140" x2="394" y2="140" style="stroke-width:3"/>
<circle class="w" cx="410" cy="140" r="16" style="stroke-width:3"/>
<text x="410" y="146" class="en nh" style="font-size:17px">0</text>
<text x="610" y="138" class="en" style="font-size:16px">Both inputs 1 → 1</text>
<text x="610" y="162" class="sd" style="font-size:17px">ٻئي 1 ته نتيجو 1</text>
<text x="12" y="223" class="en" style="font-size:22px;text-anchor:start">OR</text>
<line class="o" x1="137" y1="199" x2="208" y2="199" style="stroke-width:3"/>
<circle class="f" cx="125" cy="199" r="12" style="stroke-width:3"/>
<text x="125" y="204" class="en nh" style="font-size:14px">1</text>
<line class="o" x1="137" y1="231" x2="208" y2="231" style="stroke-width:3"/>
<circle class="w" cx="125" cy="231" r="12" style="stroke-width:3"/>
<text x="125" y="236" class="en nh" style="font-size:14px">0</text>
<use href="#gOR" class="f" transform="translate(200,215)"/>
<line class="o" x1="280" y1="215" x2="394" y2="215" style="stroke-width:3"/>
<circle class="f" cx="410" cy="215" r="16" style="stroke-width:3"/>
<text x="410" y="221" class="en nh" style="font-size:17px">1</text>
<text x="610" y="213" class="en" style="font-size:16px">Any input 1 → 1</text>
<text x="610" y="237" class="sd" style="font-size:17px">ڪو به 1 ته نتيجو 1</text>
<text x="12" y="298" class="en" style="font-size:22px;text-anchor:start">XOR</text>
<line class="o" x1="137" y1="274" x2="198" y2="274" style="stroke-width:3"/>
<circle class="f" cx="125" cy="274" r="12" style="stroke-width:3"/>
<text x="125" y="279" class="en nh" style="font-size:14px">1</text>
<line class="o" x1="137" y1="306" x2="198" y2="306" style="stroke-width:3"/>
<circle class="w" cx="125" cy="306" r="12" style="stroke-width:3"/>
<text x="125" y="311" class="en nh" style="font-size:14px">0</text>
<use href="#gOR" class="f" transform="translate(200,290)"/>
<use href="#gXB" class="o" transform="translate(200,290)"/>
<line class="o" x1="280" y1="290" x2="394" y2="290" style="stroke-width:3"/>
<circle class="f" cx="410" cy="290" r="16" style="stroke-width:3"/>
<text x="410" y="296" class="en nh" style="font-size:17px">1</text>
<text x="610" y="288" class="en" style="font-size:16px">Inputs differ → 1</text>
<text x="610" y="312" class="sd" style="font-size:17px">ڌار هجن ته نتيجو 1</text>
<text x="12" y="373" class="en" style="font-size:22px;text-anchor:start">NAND</text>
<line class="o" x1="137" y1="349" x2="200" y2="349" style="stroke-width:3"/>
<circle class="f" cx="125" cy="349" r="12" style="stroke-width:3"/>
<text x="125" y="354" class="en nh" style="font-size:14px">1</text>
<line class="o" x1="137" y1="381" x2="200" y2="381" style="stroke-width:3"/>
<circle class="w" cx="125" cy="381" r="12" style="stroke-width:3"/>
<text x="125" y="386" class="en nh" style="font-size:14px">0</text>
<use href="#gAND" class="f" transform="translate(200,365)"/>
<circle class="w" cx="284" cy="365" r="6" style="stroke-width:3"/>
<line class="o" x1="290" y1="365" x2="394" y2="365" style="stroke-width:3"/>
<circle class="f" cx="410" cy="365" r="16" style="stroke-width:3"/>
<text x="410" y="371" class="en nh" style="font-size:17px">1</text>
<text x="610" y="363" class="en" style="font-size:16px">Opposite of AND</text>
<text x="610" y="387" class="sd" style="font-size:17px">AND جو اُلٽو</text>
<text x="12" y="448" class="en" style="font-size:22px;text-anchor:start">NOR</text>
<line class="o" x1="137" y1="424" x2="208" y2="424" style="stroke-width:3"/>
<circle class="f" cx="125" cy="424" r="12" style="stroke-width:3"/>
<text x="125" y="429" class="en nh" style="font-size:14px">1</text>
<line class="o" x1="137" y1="456" x2="208" y2="456" style="stroke-width:3"/>
<circle class="w" cx="125" cy="456" r="12" style="stroke-width:3"/>
<text x="125" y="461" class="en nh" style="font-size:14px">0</text>
<use href="#gOR" class="f" transform="translate(200,440)"/>
<circle class="w" cx="286" cy="440" r="6" style="stroke-width:3"/>
<line class="o" x1="292" y1="440" x2="394" y2="440" style="stroke-width:3"/>
<circle class="w" cx="410" cy="440" r="16" style="stroke-width:3"/>
<text x="410" y="446" class="en nh" style="font-size:17px">0</text>
<text x="610" y="438" class="en" style="font-size:16px">Opposite of OR</text>
<text x="610" y="462" class="sd" style="font-size:17px">OR جو اُلٽو</text>
</svg>
